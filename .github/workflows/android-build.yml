name: DCH AI Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android Application
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Run Device Connect crypto instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Build debug and optimized release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DCH-AI-Android-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report APK sizes
        run: |
          python - <<'PYTHON'
          from pathlib import Path

          files = [
              Path("app/build/outputs/apk/debug/app-debug.apk"),
              Path("app/build/outputs/apk/release/app-release-unsigned.apk"),
          ]

          limit = 60 * 1024 * 1024

          for file in files:
              if not file.exists():
                  raise SystemExit(f"Missing APK: {file}")

              size = file.stat().st_size
              print(f"{file.name}: {size / (1024 * 1024):.2f} MiB")

              if "release" in file.name:
                  print(
                      "Release size target:",
                      "PASS" if size < limit else "NOT YET MET"
                  )
          PYTHON
