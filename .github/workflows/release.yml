name: DCH AI Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: dch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/dch-ai-release.jks"
          chmod 600 "$RUNNER_TEMP/dch-ai-release.jks"

      - name: Validate release version
        id: version
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          source = Path("app/build.gradle.kts").read_text()
          code = re.search(r'versionCode\s*=\s*(\d+)', source)
          name = re.search(r'versionName\s*=\s*"([^"]+)"', source)

          if not code or not name:
              raise SystemExit("Could not read application version.")

          version_code = code.group(1)
          version_name = name.group(1)
          tag = os.environ["GITHUB_REF_NAME"]

          if tag != f"v{version_name}":
              raise SystemExit(
                  f"Tag {tag} must match app version v{version_name}."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={version_code}\n")
              output.write(f"name={version_name}\n")

          print(f"Release version: {version_name}")
          print(f"Version code: {version_code}")
          PY

      - name: Build signed release APK
        env:
          DCH_KEYSTORE_PATH: ${{ runner.temp }}/dch-ai-release.jks
          DCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease

      - name: Prepare release assets and manifest
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          mkdir -p release-assets
          ASSET="DCH-AI-${VERSION_NAME}.apk"

          cp "$APK" "release-assets/$ASSET"

          SHA256=$(sha256sum "release-assets/$ASSET" | cut -d ' ' -f 1)

          export SHA256 ASSET

          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkAsset": os.environ["ASSET"],
              "sha256": os.environ["SHA256"]
          }

          Path("release-assets/latest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY


          echo "===== RELEASE ASSETS ====="
          ls -lh release-assets
          cat release-assets/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/DCH-AI-*.apk \
            release-assets/latest.json \
            --title "DCH AI $GITHUB_REF_NAME" \
            --generate-notes
